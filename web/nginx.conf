server {
  listen 80;

  root /usr/share/nginx/html;
  index index.html;

  # Same-origin API access: the browser calls /api/..., nginx forwards it
  # (path unchanged) to the api service on the compose network.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # SPA fallback, so client-side routes (Epic 1+) survive a reload.
  location / {
    try_files $uri /index.html;
  }
}
